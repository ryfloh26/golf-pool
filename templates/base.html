<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Golf Pool{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
    <style>
        /* Default theme (Masters green/gold). Per-tournament pages can override
           these custom properties to re-skin the whole page. */
        :root {
            --c-deep: #1a472a;        /* page background */
            --c-navbar: #0d2818;      /* nav bar */
            --c-primary: #2d5a3d;     /* header bars / buttons */
            --c-accent: #ffd700;      /* highlight (gold) */
            --c-accent-text: #333;
            --c-btn-hover-bg: #1a472a;
            --c-btn-hover-text: #ffd700;
            /* Pool-grid section colors */
            --c-round-bg: #1a472a;
            --c-round-fg: #ffd700;
            --c-total-bg: #e8f5e9;
            --c-final-bg: #ffd700;
            --c-final-fg: #333;
        }
        body { background: var(--c-deep); color: #fff; min-height: 100vh; }
        .card { background: #fff; color: #333; }
        .navbar { background: var(--c-navbar) !important; }
        .table { color: #333; }
        .leaderboard-table th { background: var(--c-primary); color: #fff; }
        .leaderboard-table .rank-1 { background: var(--c-accent); color: #333; font-weight: bold; }
        .leaderboard-table .rank-2 { background: #c0c0c0; color: #333; }
        .leaderboard-table .rank-3 { background: #cd7f32; color: #fff; }
        .mc-badge { background: #dc3545; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; }
        .golfer-detail { font-size: 0.85em; color: #666; }
        .ts-wrapper { min-width: 250px; }
        .btn-masters { background: var(--c-primary); color: #fff; border: none; }
        .btn-masters:hover { background: var(--c-btn-hover-bg); color: var(--c-btn-hover-text); }
        .score-input { width: 70px; }
        .mc-check { width: 20px; height: 20px; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Golf Pool 2026</a>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
